name: Automated tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      # No real provider credentials or CLI installation in CI.
      FLYAI_API_KEY: ""
      FLIGHT_TRACKER_MASTER_KEY: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run offline regression tests
        run: >-
          python -m pytest tests -q -ra
          --allow-hosts=127.0.0.1,::1 --allow-unix-socket
          --junitxml=test-results/python.xml
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: test-results/python.xml
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: node --check static/app.js
      - name: Run frontend tests
        run: node --test tests/test_tail_ui.cjs
