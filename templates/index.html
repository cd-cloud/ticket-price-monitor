<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight Price Tracker</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="stylesheet" href="/static/vendor/tail-accordion.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Local Dashboard</p>
          <h1>航班价格监控</h1>
          <p class="subcopy">在本地浏览器里管理航线、筛选任务、查看最新查询结果，并手动或自动触发查询。</p>
        </div>
        <div class="actions">
          <button id="runAllBtn" class="primary">立即查询全部</button>
          <button id="reportBtn" class="secondary">刷新报告</button>
          <a class="secondary linkish" href="{{ csv_url }}">下载 CSV</a>
        </div>
      </section>

      <section class="grid route-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>查询航线</h2>
            <button id="resetRouteBtn" class="ghost">清空表单</button>
          </div>
          <form id="routeForm" class="route-form" novalidate>
            <input type="hidden" id="previousRouteKey" />
            <input type="hidden" id="previousGroupId" />

            <label>
              行程类型
              <select id="routeTypeSelect" name="route_type">
                <option value="one_way">单程/往返</option>
                <option value="multi_city">多程</option>
              </select>
            </label>

            <label data-single-route-field data-base-location-field>
              出发地
              <input id="originInput" name="origin" data-airport-input placeholder="如 北京 / PEK" autocomplete="off" required />
            </label>

            <label data-single-route-field data-base-location-field>
              目的地
              <input id="destinationInput" name="destination" data-airport-input placeholder="如 上海 / SHA / SIN" autocomplete="off" required />
            </label>

            <label data-single-route-field>
              出发日期
              <input id="departureDateInput" name="departure_date" type="date" required />
            </label>

            <label data-single-route-field>
              返回日期
              <input id="returnDateInput" name="return_date" type="date" />
            </label>

            <fieldset class="span-2 route-group-fieldset">
              <legend>多城市组合</legend>
              <label class="inline-toggle">
                <input id="routeGroupEnabled" type="checkbox" />
                <span>把多个出发地/目的地展开成一组查询</span>
              </label>
              <div id="routeGroupPanel" class="route-group-panel" hidden>
                <label>
                  组名
                  <input id="routeGroupLabelInput" placeholder="如 韩国往返欧洲 / 北京去欧洲多城市" />
                </label>
                <label data-single-route-field>
                  多个出发地
                  <input id="originOptionsInput" placeholder="SEL/PUS/CJU 或 首尔、釜山、济州" />
                </label>
                <label data-single-route-field>
                  多个目的地
                  <input id="destinationOptionsInput" placeholder="PAR,BCN 或 巴黎、巴塞罗那" />
                </label>
                <label>
                  展开方式
                  <select id="expansionModeSelect">
                    <option value="cartesian">全部组合</option>
                    <option value="paired">按顺序配对</option>
                  </select>
                </label>
                <div id="routeExpansionPreview" class="route-expansion-preview"></div>
              </div>
            </fieldset>

            <label>
              舱位
              <select id="cabinSelect" name="cabin"></select>
            </label>

            <label>
              中转条件
              <select id="transferPolicySelect" name="transfer_policy">
                <option value="any">可中转</option>
                <option value="direct_only">仅直飞</option>
                <option value="transfer_only">仅中转</option>
              </select>
            </label>

            <label>
              人数
              <input id="passengersInput" name="passengers" type="number" min="1" max="9" value="1" required />
            </label>

            <label class="span-2">
              航司偏好
              <input id="airlinesInput" name="preferred_airlines" placeholder="可填 CA,MU,CZ，用逗号分隔；留空为不限" />
            </label>

            <div id="multiCityBuilder" class="span-2 segment-builder" hidden>
              <div class="segment-builder-head">
                <div>
                  <strong>多程分段</strong>
                  <p class="muted">像携程多程查询一样逐段填写。每一程包含出发地、目的地和出发日期。</p>
                </div>
                <button id="addSegmentBtn" class="ghost" type="button">+ 再加一程</button>
              </div>
              <div id="segmentRows" class="segment-rows"></div>
            </div>

            <fieldset class="span-2 provider-fieldset">
              <legend>查询平台</legend>
              <div id="providerCheckboxes" class="provider-options"></div>
            </fieldset>

            <div class="span-2 form-actions">
              <button type="submit" class="primary">保存航线</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>已配置航线</h2>
            <span class="muted">可单独开启 12h 自动查询</span>
          </div>
          <div id="routeList" class="route-list"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>任务与筛选</h2>
          <button id="reloadBtn" class="ghost">刷新数据</button>
        </div>
        <div id="runProgressSummary" class="run-progress-summary"></div>
        <div id="resultChangeSummary" class="result-change-summary"></div>
        <div class="filters">
          <label>
            平台
            <select id="providerFilter">
              <option value="">全部</option>
            </select>
          </label>
          <label>
            舱位
            <select id="cabinFilter">
              <option value="">全部</option>
            </select>
          </label>
          <label class="filter-search">
            航线关键词
            <input id="routeSearchInput" placeholder="如 PEK、SHA、SIN、北京" />
          </label>
        </div>
        <div class="task-summary" id="taskSummary"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>状态</th>
                <th>平台</th>
                <th>航线</th>
                <th>日期</th>
                <th>筛选</th>
                <th>最新价格</th>
                <th>最新查询时间</th>
                <th>最低价航班</th>
                <th>自动查询</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
      </section>

      <section class="grid log-workspace">
        <div class="panel">
          <div class="panel-head">
            <h2>最近日志</h2>
            <button id="reloadLogBtn" class="ghost">刷新日志</button>
          </div>
          <pre id="logBox">加载中...</pre>
        </div>
      </section>
    </main>

    <template id="segmentRowTemplate">
      <div class="segment-row">
        <div class="segment-number"></div>
        <label>
          出发地
          <input class="segment-origin" data-airport-input placeholder="PEK 或 SEL/PUS/CJU" autocomplete="off" />
        </label>
        <label>
          目的地
          <input class="segment-destination" data-airport-input placeholder="BJS 或 ATH/MIL/ROM/PAR" autocomplete="off" />
        </label>
        <label>
          出发日期
          <input class="segment-date" type="date" />
        </label>
        <button class="ghost danger segment-remove" type="button">删除</button>
      </div>
    </template>

    <template id="airchinaExperimentTemplate">
      <section id="airchinaExperimentPanel" class="panel airchina-workspace">
        <header class="airchina-heading">
          <div>
            <p class="eyebrow">国航实验</p>
            <h2>国航查询工作台</h2>
            <p>仅单程、明确机场、1 成人。结果是<strong>每成人不含税参考票价</strong>，不进入正式报价、最低价排名或甩尾比价。</p>
          </div>
          <span id="airchinaCurrentStatus" class="status-badge idle">未开始</span>
        </header>

        <ol id="airchinaWorkflow" class="airchina-workflow" aria-label="国航查询流程">
          <li data-step="prepare" class="active"><span>1</span>准备登录</li>
          <li data-step="query"><span>2</span>查询条件</li>
          <li data-step="run"><span>3</span>执行查询</li>
          <li data-step="results"><span>4</span>结果诊断</li>
        </ol>

        <section id="airchinaSessionCard" class="airchina-card">
          <div class="airchina-card-head">
            <h3>1. 准备登录态</h3>
            <span id="airchinaSessionBadge" class="status-badge idle">未准备</span>
          </div>
          <p id="airchinaSessionNext" class="airchina-next-action">先准备登录态，再在项目 Chrome 中完成登录或验证。</p>
          <div class="actions airchina-primary-actions">
            <button id="airchinaSessionPrepare" type="button" class="primary">准备登录态</button>
            <button id="airchinaSessionReady" type="button" class="primary" hidden>我已完成登录和验证</button>
            <button id="airchinaSessionCancelPrepare" type="button" class="secondary" hidden>取消准备</button>
          </div>
          <p id="airchinaSessionStatus" role="status">正在读取会话状态。</p>
          <details class="airchina-secondary">
            <summary>备份、会话管理与查询保护</summary>
            <div class="actions">
              <button id="airchinaSessionRestore" type="button" class="secondary">恢复本机备份</button>
              <button id="airchinaSessionClose" type="button" class="secondary">关闭会话</button>
              <button id="airchinaSessionBackupDelete" type="button" class="ghost danger">删除备份</button>
            </div>
            <label class="inline-toggle"><input id="airchinaSessionBackup" type="checkbox" checked />
              <span>就绪后保存本机加密登录态备份（需已配置项目主密钥，不导出 Cookie/token）</span>
            </label>
            <p id="airchinaQueryPolicy" role="status">正在读取国航查询保护状态。</p>
            <button id="airchinaQueryResume" type="button" class="secondary" hidden>已人工检查，解除国航查询暂停</button>
          </details>
        </section>

        <section class="airchina-card">
          <div class="airchina-card-head">
            <h3>2. 查询条件</h3>
            <span class="airchina-card-note">基础项</span>
          </div>
          <p id="airchinaFormHint" class="airchina-muted">默认使用官网表单、等待人工和常驻会话。</p>
          <form id="airchinaExperimentForm" class="route-form">
            <div class="airchina-basic-fields">
              <label>出发机场码<input name="origin" placeholder="PEK" maxlength="3" pattern="[A-Za-z]{3}" required /></label>
              <label>到达机场码<input name="destination" placeholder="SHA" maxlength="3" pattern="[A-Za-z]{3}" required /></label>
              <label>出发日期<input name="departure_date" type="date" required /></label>
              <label>舱等<select name="cabin"><option value="economy">经济舱</option><option value="business">公务舱</option></select></label>
            </div>
            <div class="actions airchina-primary-actions">
              <button type="submit" class="primary">开始实验查询</button>
              <button id="airchinaFormReset" type="button" class="ghost">重置条件</button>
            </div>
            <details id="airchinaAdvancedSettings" class="airchina-secondary">
              <summary>高级设置</summary>
              <div class="airchina-advanced-grid">
                <label>查询引擎<select name="query_engine"><option value="native" selected>原生国航实验</option><option value="flyclaw">FlyClaw 国航 Source</option></select></label>
                <label>查询入口<select name="entry_mode"><option value="direct">直达结果页（对照）</option><option value="form" selected>官网表单（推荐）</option><option value="results">结果页续查（同条件实验，不回首页）</option></select></label>
                <label>遇阻处理<select name="interaction_mode"><option value="stop">无人值守：遇到验证或未知提示即停止</option><option value="wait" selected>等待人工：在同一页面处理后继续</option></select></label>
                <label>浏览器会话<select name="session_mode"><option value="persistent" selected>常驻会话（推荐，应用运行期间复用）</option><option value="reuse">短时复用（10 分钟空闲 / 30 分钟总寿命）</option><option value="fresh">每任务重启（对照，不清除持久档案）</option></select></label>
                <label>指定航班（可选）<input name="flight_no" placeholder="CA1549；留空只读列表" pattern="[A-Za-z]{2}[0-9]{3,4}" /></label>
                <label class="inline-toggle"><input name="auto_confirm_notices" type="checkbox" checked />
                  <span>自动确认查询通知，并记录内容（不含验证码、登录、个人声明、预订或支付）</span>
                </label>
              </div>
            </details>
          </form>
          <details class="airchina-secondary">
            <summary>使用说明与限制</summary>
            <p>准备阶段只打开官网，不查询航班；查询总时限 4 分钟（含人工等待），不会自动处理验证码或预订。</p>
            <p>常驻会话跨任务复用同一页面和上下文；验证未解除、访问受限、取消、超时或配置变化会清理。应用重启后使用固定持久档案，也可显式恢复加密备份，均不保证免验证。</p>
            <p>表单模式支持未来 365 天内日期和普通 1 成人。结果页续查须已有同条件成功参考列表，仅支持“短时复用＋无人值守”，不会接受旧票价冒充新结果。</p>
          </details>
        </section>

        <section id="airchinaTaskCard" class="airchina-card">
          <div class="airchina-card-head">
            <h3>3. 执行状态</h3>
            <span id="airchinaTaskBadge" class="status-badge idle">尚未选择任务</span>
          </div>
          <p id="airchinaNextAction" class="airchina-next-action">准备登录态后即可开始查询。</p>
          <div class="actions">
            <label>任务记录<select id="airchinaExperimentJobs" aria-label="国航实验任务记录"></select></label>
            <button id="airchinaExperimentRefresh" type="button" class="secondary">刷新记录</button>
            <button id="airchinaExperimentContinue" type="button" class="primary" hidden>我已手动处理，继续读取</button>
            <button id="airchinaExperimentCancel" type="button" class="secondary" hidden>取消任务</button>
          </div>
          <div id="airchinaExperimentStatus" role="status" aria-live="polite">尚未选择任务。</div>
          <p id="airchinaExperimentError" role="alert"></p>
        </section>

        <section class="airchina-card">
          <div class="airchina-card-head">
            <h3>4. 结果与诊断</h3>
            <span class="airchina-card-note">参考信息，不代表可出票</span>
          </div>
          <div id="airchinaExperimentResults" class="airchina-experiment-results"></div>
          <details id="airchinaNoticesDetails" class="airchina-secondary">
            <summary>官网提示记录</summary>
            <div id="airchinaExperimentNotices"></div>
          </details>
        </section>
      </section>
    </template>
    <script>
      document.querySelector(".shell").appendChild(document.getElementById("airchinaExperimentTemplate").content.cloneNode(true));
    </script>
    <script src="/static/airport_data.js?v={{ static_version }}"></script>
    <script src="/static/airport_ui.js?v={{ static_version }}"></script>
    <script src="/static/app/api.js?v={{ static_version }}"></script>
    <script src="/static/app/store.js?v={{ static_version }}"></script>
    <script src="/static/app/common.js?v={{ static_version }}"></script>
    <script src="/static/app/route_form.js?v={{ static_version }}"></script>
    <script src="/static/app/dashboard.js?v={{ static_version }}"></script>
    <script src="/static/app/browser_profiles.js?v={{ static_version }}"></script>
    <script src="/static/app/tail_form.js?v={{ static_version }}"></script>
    <script src="/static/app/tail_jobs.js?v={{ static_version }}"></script>
    <script src="/static/app/tail_results.js?v={{ static_version }}"></script>
    <script src="/static/app/workspace.js?v={{ static_version }}"></script>
    <script src="/static/app.js?v={{ static_version }}"></script>
    <script src="/static/airchina_experiment.js?v={{ static_version }}"></script>
  </body>
</html>
